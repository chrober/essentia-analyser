[package]
name = "essentia-analyser"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/chrober/essentia-analyser"
description = "Offline Essentia C++ and ONNX audio feature analyser for the Lyrion community"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ort = "=2.0.0-rc.14"
rustfft = "6.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
